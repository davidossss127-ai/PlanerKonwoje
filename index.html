<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planer Konwojów ETS2 - Polska Logistyka</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            display: flex;
            gap: 20px;
            max-width: 1050px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }
        .panel {
            background-color: #1a1a1a;
            border: 3px solid #dc2626;
            border-radius: 12px;
            width: 480px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(220, 38, 38, 0.2);
            box-sizing: border-box;
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #dc2626;
            padding-bottom: 10px;
            margin-bottom: 15px;
            background: linear-gradient(to bottom, #1a1a1a, #260505);
            border-radius: 8px 8px 0 0;
            padding-top: 5px;
        }
        .header h2 { margin: 0; color: #ffffff; font-size: 18px; text-shadow: 0 0 5px rgba(220,38,38,0.5); }
        .header span { font-size: 12px; color: #dc2626; font-weight: bold; }
        
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 12px;
            color: #ccc;
            margin-bottom: 4px;
            font-weight: bold;
        }
        input, textarea, select {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #111;
            color: #fff;
            font-size: 13px;
            box-sizing: border-box;
        }
        input:focus, textarea:focus, select:focus {
            border-color: #dc2626;
            outline: none;
        }
        textarea {
            resize: vertical;
            height: 60px;
        }
        .btn {
            background-color: #dc2626;
            color: #ffffff;
            border: 2px solid #b91c1c;
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
        }
        .btn:hover { background-color: #ef4444; }
        .btn-copy {
            background-color: #ffffff;
            color: #000000;
            border: 2px solid #ffffff;
        }
        .btn-copy:hover { background-color: #e0e0e0; }
        .btn-discord {
            background-color: #5865F2;
            border: 2px solid #4752C4;
            margin-top: 6px;
        }
        .btn-discord:hover { background-color: #4752C4; }

        .output-box {
            background-color: #111111;
            border: 2px solid #333;
            border-radius: 6px;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            color: #ffffff;
            font-size: 12px;
            white-space: pre-wrap;
            height: 180px;
            overflow-y: auto;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        .placeholder-text {
            color: #666;
            text-align: center;
            margin-top: 60px;
        }
        .map-preview-container {
            margin-bottom: 10px;
            text-align: center;
        }
        .map-preview-container canvas {
            max-width: 100%;
            border: 2px solid #333;
            border-radius: 6px;
            background: #000;
        }
        .status-msg {
            font-size: 11px;
            text-align: center;
            margin-top: 5px;
            color: #10b981;
            min-height: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- PANEL FORMULARZA -->
    <div class="panel">
        <div class="header">
            <h2>POLSKA LOGISTYKA</h2>
            <span>PLANER KONWOJÓW ETS2</span>
        </div>

        <div class="form-group">
            <label>Tytuł Konwoju:</label>
            <input type="text" id="convoyTitle" value="Oficjalny Konwój Polska Logistyka">
        </div>

        <div class="form-group">
            <label>Miejsce wyjazdu (Skąd):</label>
            <input type="text" id="convoyFrom" value="Warszawa">
        </div>

        <div class="form-group">
            <label>Miejsce docelowe (Dokąd):</label>
            <input type="text" id="convoyTo" value="Berlin">
        </div>

        <div style="display: flex; gap: 10px;">
            <div class="form-group" style="flex: 1;">
                <label>Data:</label>
                <input type="date" id="convoyDate">
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Godzina zbiórki:</label>
                <input type="time" id="convoyTime" value="20:00">
            </div>
        </div>

        <div class="form-group">
            <label>Serwer / Tryb:</label>
            <select id="convoyServer">
                <option value="Simulation 1">Simulation 1 (TruckersMP - Standard)</option>
                <option value="Simulation 2">Simulation 2 (TruckersMP - Standard)</option>
                <option value="ProMods">ProMods (TruckersMP)</option>
                <option value="ProMods Convoy">ProMods (Prywatne DLC Convoy)</option>
                <option value="Arcade">Arcade (TruckersMP)</option>
                <option value="Konwój Prywatny">Konwój Prywatny (Standard DLC Convoy)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Dodatkowe informacje (ładunek, masa):</label>
            <input type="text" id="convoyCargo" value="Ładunek: Sprzęt medyczny">
        </div>

        <div class="form-group">
            <label>Notatki / Wymagania:</label>
            <textarea id="convoyNotes">Wymagane pełne tankowanie, naprawiony ciągnik i kulturalna jazda zgodnie z przepisami TMP.</textarea>
        </div>

        <button class="btn" onclick="generateConvoy()">Generuj Opis Konwoju i Mapkę</button>
    </div>

    <!-- PANEL WYNIKOWY -->
    <div class="panel">
        <div class="header">
            <h2>WYNIK GENERATORA</h2>
            <span>Podgląd trasy i wysyłka do Discorda</span>
        </div>

        <div class="map-preview-container">
            <label style="margin-bottom: 2px; text-align: left;">Wygenerowana mapka trasy:</label>
            <canvas id="routeCanvas" width="440" height="140"></canvas>
        </div>

        <div class="output-box" id="outputBox">
            <div class="placeholder-text">Wypełnij formularz i kliknij przycisk generowania.</div>
        </div>

        <div class="status-msg" id="statusMsg"></div>

        <button class="btn btn-copy" onclick="copyToClipboard()">📋 Kopiuj tekst do schowka</button>
        <button class="btn btn-discord" onclick="sendToDiscord()">🚀 Wyślij ogłoszenie + mapkę na Discorda</button>
    </div>
</div>

<script>
    document.getElementById('convoyDate').valueAsDate = new Date();
    
    const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1554000079545704519/lFXmXqngtC-1_stCXmfQ5yQiA0LkdjMJkL5z3SWHJ7O9waneBh-5MwGzSKmR1X2M7ubE";

    let generatedBlob = null;

    function generateMapImage(from, to, title) {
        const canvas = document.getElementById('routeCanvas');
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 1;
        for (let x = 0; x < canvas.width; x += 30) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for (let y = 0; y < canvas.height; y += 30) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }

        const startX = 70;
        const startY = 85;
        const endX = 370;
        const endY = 85;

        ctx.strokeStyle = '#3b82f6';
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.bezierCurveTo(220, 20, 220, 140, endX, endY);
        ctx.stroke();

        ctx.strokeStyle = '#93c5fd';
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 6]);
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.bezierCurveTo(220, 20, 220, 140, endX, endY);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = '#10b981';
        ctx.beginPath();
        ctx.arc(startX, startY, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#dc2626';
        ctx.beginPath();
        ctx.arc(endX, endY, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 13px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText(from.toUpperCase(), startX, startY + 30);
        ctx.fillText(to.toUpperCase(), endX, endY + 30);

        ctx.fillStyle = '#94a3b8';
        ctx.font = 'bold 11px Segoe UI';
        ctx.textAlign = 'left';
        ctx.fillText("TRASA KONWOJU: " + title, 15, 25);

        ctx.fillStyle = '#ffffff';
        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('🚚', 220, 68);

        canvas.toBlob((blob) => {
            generatedBlob = blob;
        }, 'image/png');
    }

    function generateConvoy() {
        const title = document.getElementById('convoyTitle').value.trim();
        const from = document.getElementById('convoyFrom').value.trim();
        const to = document.getElementById('convoyTo').value.trim();
        const date = document.getElementById('convoyDate').value;
        const time = document.getElementById('convoyTime').value;
        const server = document.getElementById('convoyServer').value;
        const cargo = document.getElementById('convoyCargo').value.trim();
        const notes = document.getElementById('convoyNotes').value.trim();

        generateMapImage(from, to, title);

        const formattedText = `🚚 **${title}** 🚚
━━━━━━━━━━━━━━━━━━━━━━━━━━━━
🏢 **Firma:** Polska Logistyka
📍 **Trasa:** ${from} ➡️ ${to}
📅 **Data:** ${date}
⏰ **Godzina zbiórki:** ${time}
🌐 **Serwer / Tryb:** ${server}
📦 **Dodatkowe info:** ${cargo}
━━━━━━━━━━━━━━━━━━━━━━━━━━━━
📝 **Wymagania i uwagi:**
${notes}

Do zobaczenia na trasie! Szerokiej drogi! 🚛💨`;

        document.getElementById('outputBox').innerText = formattedText;
        document.getElementById('statusMsg').innerText = '✅ Wygenerowano opis i mapkę trasy!';
        document.getElementById('statusMsg').style.color = '#10b981';
    }

    function copyToClipboard() {
        const outputBox = document.getElementById('outputBox');
        const text = outputBox.innerText;

        if (!text || text.includes('Wypełnij formularz')) {
            alert('Najpierw wygeneruj opis konwoju!');
            return;
        }

        navigator.clipboard.writeText(text).then(() => {
            alert('Tekst został pomyślnie skopiowany do schowka!');
        }).catch(err => {
            alert('Nie udało się skopiować tekstu.');
        });
    }

    async function sendToDiscord() {
        const outputBox = document.getElementById('outputBox');
        const text = outputBox.innerText;
        const statusMsg = document.getElementById('statusMsg');

        if (!text || text.includes('Wypełnij formularz')) {
            alert('Najpierw wygeneruj opis konwoju!');
            return;
        }

        statusMsg.style.color = "#f59e0b";
        statusMsg.innerText = "Wysyłanie na Discorda z mapką i przyciskami obecności...";

        try {
            const formData = new FormData();
            
            // Konfiguracja wiadomości wraz z interaktywnymi komponentami Discorda (przyciski obecności)
            const payload = {
                content: text,
                components: [
                    {
                        type: 1, // Action Row
                        components: [
                            {
                                type: 2, // Button
                                style: 3, // Success (Zielony)
                                label: "Będę",
                                custom_id: "convoy_attending_yes",
                                emoji: { name: "✅" }
                            },
                            {
                                type: 2, // Button
                                style: 4, // Danger (Czerwony)
                                label: "Nie będzie mnie",
                                custom_id: "convoy_attending_no",
                                emoji: { name: "❌" }
                            }
                        ]
                    }
                ]
            };
            
            formData.append('payload_json', JSON.stringify(payload));
            
            if (generatedBlob) {
                formData.append('file', generatedBlob, 'trasa_konwoju.png');
            }

            const response = await fetch(DISCORD_WEBHOOK_URL, {
                method: 'POST',
                body: formData
            });

            if (response.ok || response.status === 204) {
                statusMsg.style.color = "#10b981";
                statusMsg.innerText = "✅ Konwój wraz z mapą i przyciskami obecności został wysłany!";
            } else {
                throw new Error('Błąd serwera Discord');
            }
        } catch (error) {
            statusMsg.style.color = "#ef4444";
            statusMsg.innerText = "❌ Błąd wysyłania. Sprawdź konsolę przeglądarki.";
            console.error(error);
        }
    }

    window.onload = generateConvoy;
</script>

</body>
</html>
